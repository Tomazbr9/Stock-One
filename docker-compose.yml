version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: stockone-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: stockone-db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: pass

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: